[package]
name = "poribesh"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Defensive, schema-validated environment variable loader, interpolator, and dotenv file manager."
repository = "https://github.com/Hitarashi/poribesh"
readme = "README.md"
keywords = ["env", "dotenv", "configuration", "validation", "schema"]
categories = ["config", "development-tools"]

[features]
default = ["regex", "serde"]
regex = ["dep:regex"]
serde = ["dep:serde"]

[dependencies]
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"], optional = true }

[dev-dependencies]
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.154"
