[package]
name = "poribesh"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Defensive, schema-validated environment variable loader, interpolator, and dotenv file manager."
repository = "https://github.com/Hitarashi/poribesh"
readme = "README.md"
keywords = ["env", "dotenv", "configuration", "validation", "schema"]
categories = ["config", "development-tools"]

[features]
default = ["regex", "serde"]
jachai = ["dep:jachai", "dep:serde_json"]
regex = ["dep:regex"]
serde = ["dep:serde"]

[dependencies]
jachai = { version = "0.1.0", git = "https://github.com/Hitarashi/jachai.git", branch = "main", default-features = false, features = [
    "schema-string",
    "schema-number",
    "schema-boolean",
    "schema-network",
    "coercion",
], optional = true }
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"], optional = true }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
jachai = { version = "0.1.0", git = "https://github.com/Hitarashi/jachai.git", branch = "main", default-features = false, features = [
    "schema-string",
    "schema-number",
    "schema-boolean",
    "schema-network",
    "coercion",
] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.154"
dotenvy = "0.15.7"

[[bench]]
name = "cross_benchmark"
harness = false
